<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOB DNA V2</title>
<style>
:root{--ink:#17181b;--muted:#73757d;--line:#e5e2dc;--bg:#f7f6f3;--card:#fff;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:28px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.12em;font-size:14px}
.progress{height:5px;background:#e7e4df;border-radius:10px;margin:20px 0 34px;overflow:hidden} .bar{height:100%;background:#17181b;width:0;transition:.25s}
h1{font-size:42px;line-height:1.05;margin:0 0 18px;letter-spacing:-.04em} h2{font-size:29px;line-height:1.12;letter-spacing:-.03em;margin:0 0 26px}
p{font-size:18px;line-height:1.55;color:#4d4f56}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.03)}
.start{margin-top:28px} button{font:inherit;border:0;cursor:pointer}
.primary{width:100%;background:#17181b;color:#fff;border-radius:18px;padding:18px 20px;font-size:18px;font-weight:700;margin-top:18px}
.option{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #ddd9d2;border-radius:17px;padding:18px 17px;margin:12px 0;font-size:17px;line-height:1.35;transition:.15s}
.option:active,.option.selected{background:#17181b;color:white;border-color:#17181b}
.nav{display:flex;gap:10px;margin-top:20px} .nav button{flex:1;padding:15px;border-radius:15px;font-weight:700}
.back{background:#e9e7e2;color:#25262a} .next{background:#17181b;color:#fff}
.small{font-size:14px;color:var(--muted);margin-top:16px}
.result h1{font-size:40px} .dim{margin:22px 0} .dimline{display:flex;justify-content:space-between;font-weight:700;font-size:16px} .track{height:9px;background:#e6e3de;border-radius:10px;margin-top:8px;overflow:hidden} .fill{height:100%;background:#17181b;border-radius:10px}
.tag{display:inline-block;background:#ece9e3;border-radius:999px;padding:9px 13px;margin:5px 5px 0 0;font-size:14px}
.list{padding-left:22px;font-size:18px;line-height:1.55} .note{background:#eeece7;border-radius:20px;padding:20px;margin-top:24px}
.hide{display:none}
@media(max-width:520px){h1{font-size:37px} h2{font-size:27px} .card{padding:23px;border-radius:24px}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"></div>
</div>
<script>
const questions=[{"q": "Masz wolne popołudnie i niczego nie musisz robić. Co najczęściej robisz?", "options": ["Wymyślam sobie coś nowego do zrobienia", "Wracam do czegoś, co już dobrze znam", "Spotykam się lub rozmawiam z kimś", "Porządkuję coś albo domykam zaległą sprawę"], "weights": [0, 3, 6, 1]}, {"q": "Dostajesz zadanie bez dokładnej instrukcji. Co jest dla Ciebie najbardziej naturalne?", "options": ["Sam ustalam sposób działania", "Najpierw szukam przykładów lub zasad", "Pytam innych, czego oczekują", "Rozbijam problem na małe kroki"], "weights": [7, 1, 2, 4]}, {"q": "W projekcie pojawia się nieoczekiwana zmiana. Twoja pierwsza reakcja to raczej:", "options": ["Ciekawość, co nowego można z tego zrobić", "Sprawdzenie, co dokładnie się zmieniło", "Sprawdzenie, jak wpłynie to na ludzi", "Powrót do planu i ustalenie nowej kolejności"], "weights": [5, 3, 2, 0]}, {"q": "Która sytuacja daje Ci większe poczucie satysfakcji?", "options": ["Stworzenie czegoś po swojemu", "Doprowadzenie sprawy do przewidywalnego końca", "Przekonanie innych do wspólnego rozwiązania", "Rozwiązanie trudnego problemu"], "weights": [3, 6, 1, 4]}, {"q": "Masz wybrać między dwiema możliwościami. Jedna jest bezpieczniejsza, druga ciekawsza, ale niepewna. Co robisz najczęściej?", "options": ["Wybieram ciekawszą", "Wybieram bezpieczniejszą", "Szukam sposobu, by połączyć oba warianty", "Odkładam decyzję do czasu zdobycia większej ilości danych"], "weights": [2, 4, 5, 7]}, {"q": "W grupie ktoś przedstawia pomysł, z którym się nie zgadzasz. Co robisz najchętniej?", "options": ["Od razu przedstawiam kontrargumenty", "Najpierw próbuję zrozumieć jego tok myślenia", "Szukam rozwiązania, które połączy oba podejścia", "Jeśli sprawa nie jest kluczowa, odpuszczam"], "weights": [0, 6, 5, 3]}, {"q": "Gdy uczysz się czegoś nowego, co działa na Ciebie najlepiej?", "options": ["Eksperymentowanie i samodzielne próby", "Jasna instrukcja krok po kroku", "Rozmowa z kimś, kto już to umie", "Zrozumienie, dlaczego to działa"], "weights": [6, 1, 4, 7]}, {"q": "Wyobraź sobie, że możesz przez miesiąc pracować nad dowolnym projektem. Co najbardziej Cię przyciąga?", "options": ["Projekt, w którym można coś wymyślić od podstaw", "Projekt z jasnym celem i konkretnym końcem", "Projekt, w którym trzeba współpracować z ludźmi", "Projekt wymagający znalezienia najlepszego rozwiązania"], "weights": [5, 7, 0, 2]}, {"q": "Co bardziej Ci przeszkadza?", "options": ["Nuda i powtarzalność", "Brak jasnych zasad", "Niepotrzebne konflikty", "Brak możliwości sprawdzenia, czy coś działa"], "weights": [3, 1, 0, 6]}, {"q": "Masz dużo zadań i ograniczony czas. Co robisz najpierw?", "options": ["Wybieram to, co może przynieść największy efekt", "Ustalam kolejność według pilności", "Sprawdzam, od czego zależą inni", "Wybieram zadanie, które jest najbardziej złożone"], "weights": [1, 4, 7, 2]}, {"q": "Ktoś daje Ci odpowiedzialność za obszar, którego wcześniej nie znałeś. Jak reagujesz?", "options": ["Brzmi interesująco", "Wolę najpierw poznać oczekiwania i zasady", "Najpierw pytam, kto może mi pomóc", "Najpierw zbieram informacje i analizuję temat"], "weights": [0, 2, 3, 5]}, {"q": "Gdy masz dużo swobody, co jest dla Ciebie najtrudniejsze?", "options": ["Nic — właśnie tego potrzebuję", "Brak punktu odniesienia", "Brak ludzi, z którymi można konsultować decyzje", "Brak kryteriów, po których poznaję, czy robię to dobrze"], "weights": [6, 4, 3, 1]}, {"q": "Wolisz zadanie, którego wynik jest:", "options": ["Niepewny, ale może być wyjątkowy", "Dość przewidywalny", "Zależny od współpracy z innymi", "Możliwy do dokładnego zmierzenia"], "weights": [4, 7, 2, 5]}, {"q": "Kiedy coś nie wychodzi za pierwszym razem, co zwykle robisz?", "options": ["Próbuję innego podejścia", "Wracam do sprawdzonego sposobu", "Pytam kogoś o perspektywę", "Szukam przyczyny błędu"], "weights": [3, 5, 6, 0]}, {"q": "Co bardziej Cię motywuje?", "options": ["Możliwość decydowania o sposobie działania", "Poczucie stabilności", "Uznanie lub dobra współpraca", "Widoczny postęp i rezultat"], "weights": [1, 7, 6, 4]}, {"q": "Masz przed sobą problem, którego nikt wcześniej nie rozwiązał. Co jest dla Ciebie najbardziej atrakcyjne?", "options": ["Możliwość stworzenia własnego rozwiązania", "Możliwość zbudowania procesu, który później będzie działał", "Możliwość zebrania ludzi wokół rozwiązania", "Możliwość odkrycia, co naprawdę powoduje problem"], "weights": [7, 2, 5, 0]}, {"q": "W pracy nad czymś długoterminowym najbardziej pomaga Ci:", "options": ["Zmieniające się wyzwania", "Stały rytm działania", "Kontakt z innymi", "Możliwość obserwowania danych i postępów"], "weights": [6, 0, 1, 3]}, {"q": "Jeżeli ktoś kontroluje każdy szczegół Twojego działania, jak się czujesz?", "options": ["Szybko tracę energię", "Czuję się bezpieczniej, jeśli kontrola jest rzeczowa", "Najważniejsze, żeby można było o tym porozmawiać", "Akceptuję to, jeśli kryteria są logiczne"], "weights": [4, 2, 1, 7]}, {"q": "Masz do wyboru zadanie proste i trudne. Oba są równie ważne. Co wybierasz?", "options": ["Trudne, jeśli daje możliwość zrobienia czegoś inaczej", "Proste, jeśli pozwala szybko zamknąć temat", "To zależy od tego, kto będzie korzystał z efektu", "Trudne, jeśli wymaga myślenia"], "weights": [2, 5, 0, 3]}, {"q": "Co robisz, gdy zasady sytuacji są niejasne?", "options": ["Tworzę własne zasady działania", "Szukam osoby lub źródła, które je wyjaśni", "Sprawdzam, jak inni podchodzą do podobnych sytuacji", "Zbieram fakty i wyciągam własny wniosek"], "weights": [1, 3, 4, 6]}, {"q": "W dyskusji najbardziej naturalna jest dla Ciebie rola:", "options": ["Osoby, która proponuje nowe kierunki", "Osoby, która pilnuje konkretów", "Osoby, która szuka porozumienia", "Osoby, która sprawdza logikę argumentów"], "weights": [7, 5, 4, 2]}, {"q": "Co jest dla Ciebie większym problemem?", "options": ["Robienie ciągle tego samego", "Niepewność co do przyszłości", "Praca bez kontaktu z ludźmi", "Podejmowanie decyzji bez wystarczających informacji"], "weights": [5, 0, 3, 6]}, {"q": "Wyobraź sobie, że możesz zmienić jedną rzecz w dowolnym procesie, z którym masz kontakt. Co wybierasz?", "options": ["Dać ludziom więcej swobody", "Uprościć i ustabilizować przebieg", "Poprawić współpracę między ludźmi", "Usunąć niepotrzebne kroki na podstawie danych"], "weights": [4, 6, 7, 1]}, {"q": "Jak reagujesz, gdy ktoś kwestionuje Twoją decyzję?", "options": ["Traktuję to jako okazję do sprawdzenia własnego pomysłu", "Najpierw sprawdzam, czy nie naruszyłem ustalonych zasad", "Chcę zrozumieć jego punkt widzenia", "Sprawdzam argumenty i fakty"], "weights": [2, 0, 7, 5]}, {"q": "Które zdanie jest Ci bliższe?", "options": ["Wolę mieć możliwość zmiany kierunku", "Wolę wiedzieć, czego się spodziewać", "Wolę działać z ludźmi niż obok nich", "Wolę rozumieć mechanizm, zanim podejmę decyzję"], "weights": [0, 3, 6, 1]}, {"q": "Dostajesz bardzo ambitny cel, ale nikt nie mówi dokładnie, jak go osiągnąć. Co robisz?", "options": ["Tworzę własną strategię", "Najpierw ustalam granice i zasoby", "Szukam osób, które pomogą go osiągnąć", "Analizuję możliwe drogi dojścia"], "weights": [7, 1, 2, 4]}, {"q": "Co bardziej Cię cieszy po zakończeniu projektu?", "options": ["Że powstało coś nowego", "Że wszystko zostało uporządkowane", "Że ludzie dobrze ze sobą współpracowali", "Że rozwiązanie działa zgodnie z założeniami"], "weights": [5, 3, 2, 0]}, {"q": "Kiedy masz podjąć decyzję szybko, czego najbardziej Ci brakuje?", "options": ["Swobody, by wybrać własne rozwiązanie", "Pewności, że konsekwencje są akceptowalne", "Możliwości skonsultowania jej z kimś", "Danych potrzebnych do oceny opcji"], "weights": [3, 6, 1, 4]}, {"q": "Jeśli możesz wybrać sposób wykonania zadania, najczęściej:", "options": ["Wymyślam własny sposób", "Wybieram sprawdzony sposób", "Dostosowuję go do osób, z którymi pracuję", "Szukam sposobu najbardziej efektywnego"], "weights": [2, 4, 5, 7]}, {"q": "Co najbardziej przyciąga Twoją uwagę w nowym temacie?", "options": ["Co można z nim zrobić", "Jak można go zastosować w przewidywalny sposób", "Jak ludzie na niego reagują", "Jak działa i z czego wynika"], "weights": [0, 6, 5, 3]}, {"q": "Wolisz środowisko, w którym:", "options": ["Często pojawiają się nowe możliwości", "Zasady są stabilne i przewidywalne", "Dużo rzeczy załatwia się przez współpracę", "Decyzje opierają się na konkretnych przesłankach"], "weights": [6, 1, 4, 7]}, {"q": "Jeżeli przez kilka tygodni wszystko idzie zgodnie z planem, Twoja reakcja jest najczęściej:", "options": ["Zaczynam szukać kolejnego wyzwania", "Doceniam, że wszystko działa spokojnie", "Korzystam z czasu na poprawę relacji lub współpracy", "Sprawdzam, czy można coś jeszcze zoptymalizować"], "weights": [5, 7, 0, 2]}, {"q": "Masz do wykonania czynność, którą można zrobić na kilka sposobów. Co wybierasz?", "options": ["Najbardziej kreatywny sposób", "Najbardziej przewidywalny sposób", "Sposób najłatwiejszy dla innych osób", "Sposób, który daje najlepszy mierzalny efekt"], "weights": [3, 1, 0, 6]}, {"q": "Kiedy ktoś prosi Cię o pomoc, co najbardziej naturalnie robisz?", "options": ["Pokazuję inne możliwe podejście", "Daję mu konkretny, uporządkowany sposób", "Rozmawiam i próbuję zrozumieć sytuację", "Pomagam znaleźć przyczynę problemu"], "weights": [1, 4, 7, 2]}, {"q": "Co bardziej Cię satysfakcjonuje?", "options": ["Wpływ na kierunek, w którym coś idzie", "Poczucie, że coś jest dobrze zabezpieczone", "Dobre relacje i wzajemne zaufanie", "Rozwiązanie czegoś, co wcześniej było trudne"], "weights": [0, 2, 3, 5]}, {"q": "Wyobraź sobie dwa zespoły. W którym wolałbyś działać?", "options": ["Mały zespół, dużo swobody", "Zespół z jasnymi procedurami", "Zespół bardzo współpracujący", "Zespół mocno nastawiony na rozwiązywanie problemów"], "weights": [6, 4, 3, 1]}, {"q": "Co robisz, gdy pojawia się okazja, ale nie masz pewności, czy się opłaci?", "options": ["Sprawdzam, czy można ją przetestować małym kosztem", "Czekam, aż ryzyko będzie lepiej określone", "Pytam osoby, których ta decyzja dotyczy", "Porównuję dostępne dane"], "weights": [4, 7, 2, 5]}, {"q": "Po czym najłatwiej poznajesz, że dobrze wykonałeś zadanie?", "options": ["Mam poczucie, że zrobiłem je po swojemu", "Spełnia ustalone kryteria", "Osoby, których dotyczy, są zadowolone", "Rezultat potwierdzają konkretne informacje"], "weights": [3, 5, 6, 0]}, {"q": "Gdybyś miał przez rok robić tylko jeden rodzaj zadań, co byłoby najmniej trudne?", "options": ["Zmienianie i ulepszanie rzeczy", "Utrzymywanie czegoś w dobrym porządku", "Praca wymagająca stałego kontaktu z ludźmi", "Analizowanie i rozwiązywanie problemów"], "weights": [1, 7, 6, 4]}, {"q": "Na koniec dnia największą satysfakcję daje Ci:", "options": ["Myśl: „zrobiłem coś po swojemu”", "Myśl: „mam wszystko pod kontrolą”", "Myśl: „dobrze zadziałałem z ludźmi”", "Myśl: „rozwiązałem coś konkretnego”"], "weights": [7, 2, 5, 0]}];
const dims=[{"name": "Autonomia", "desc": "Potrzeba wpływu na sposób działania i decydowania."}, {"name": "Stabilność", "desc": "Potrzeba przewidywalności, jasnych ram i poczucia bezpieczeństwa."}, {"name": "Różnorodność", "desc": "Potrzeba nowych bodźców, zmian i różnorodnych wyzwań."}, {"name": "Relacje", "desc": "Naturalna orientacja na ludzi, współpracę i wpływ społeczny."}, {"name": "Analityka", "desc": "Potrzeba rozumienia mechanizmów, danych i przyczyn."}, {"name": "Rezultat", "desc": "Orientacja na efekt, postęp i skuteczność."}, {"name": "Kreatywność", "desc": "Skłonność do tworzenia nowych podejść i rozwiązań."}, {"name": "Struktura", "desc": "Potrzeba porządku, procesu i domykania spraw."}];
let answers=[];
let idx=-1;
const app=document.getElementById('app');

function start(){
 answers=new Array(questions.length).fill(null); idx=0; renderQ();
}
function renderIntro(){
 app.innerHTML=`<div class="top"><span>JOB DNA</span><span>V2</span></div>
 <div class="card start">
 <p style="text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700;color:#777">Neutralny test profilu pracy</p>
 <h1>Nie zgaduj, jaka praca do Ciebie pasuje.</h1>
 <p>Ten test nie pyta Cię wprost o zawód, branżę ani stanowisko. Zamiast tego sprawdza wzorce Twoich naturalnych wyborów w różnych sytuacjach.</p>
 <p><b>40 pytań · około 10 minut</b></p>
 <button class="primary" onclick="start()">Zaczynamy</button>
 <div class="small">Wynik pojawi się dopiero po zakończeniu. Nie będziemy podpowiadać Ci, co mierzy dane pytanie.</div>
 </div>`;
}
function renderQ(){
 const q=questions[idx], pct=Math.round(((idx)/questions.length)*100);
 const selected=answers[idx];
 app.innerHTML=`<div class="top"><span>JOB DNA</span><span>${idx+1} / ${questions.length}</span></div>
 <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
 <div class="card">
 <h2>${q.q}</h2>
 <div>${q.options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="choose(${i})">${o}</button>`).join('')}</div>
 <div class="nav">
 <button class="back" onclick="back()" ${idx===0?'disabled':''}>Wstecz</button>
 <button class="next" onclick="next()">${idx===questions.length-1?'Zobacz wynik':'Dalej'}</button>
 </div>
 </div>`;
}
function choose(i){answers[idx]=i; renderQ();}
function back(){if(idx>0){idx--;renderQ()}}
function next(){
 if(answers[idx]===null){alert('Wybierz jedną odpowiedź.');return;}
 if(idx<questions.length-1){idx++;renderQ();} else renderResult();
}
function renderResult(){
 const scores=new Array(dims.length).fill(0);
 answers.forEach((a,i)=>{if(a!==null)scores[questions[i].weights[a]]++;});
 const max=Math.max(...scores), min=Math.min(...scores);
 const ranked=scores.map((s,i)=>({i,s})).sort((a,b)=>b.s-a.s);
 const top=ranked.slice(0,3), low=ranked.slice(-2).reverse();
 let title;
 const names=top.map(x=>dims[x.i][0]);
 if(top[0].s-top[2].s<=1) title="Wszechstronny profil";
 else if(names.includes("Autonomia") && names.includes("Różnorodność")) title="Niezależny odkrywca";
 else if(names.includes("Stabilność") && names.includes("Struktura")) title="Architekt stabilności";
 else if(names.includes("Relacje") && names.includes("Rezultat")) title="Mobilizator";
 else if(names.includes("Analityka") && names.includes("Kreatywność")) title="Twórczy analityk";
 else title="Profil wielotorowy";

 const topTags=top.map(x=>`<span class="tag">${dims[x.i][0]}</span>`).join('');
 const bars=ranked.map(x=>`<div class="dim"><div class="dimline"><span>${dims[x.i][0]}</span><span>${Math.round(x.s/questions.length*100*4)}%</span></div><div class="track"><div class="fill" style="width:${Math.round(x.s/max*100)}%"></div></div></div>`).join('');
 const environments = [];
 if(scores[0]>=scores[1]) environments.push("miejsce, w którym masz realny wpływ na sposób działania");
 if(scores[1]>=scores[0]) environments.push("środowisko z czytelnymi zasadami i przewidywalnością");
 if(scores[2]>=scores[3]) environments.push("praca, w której nie wszystko wygląda tak samo");
 if(scores[3]>=scores[2]) environments.push("praca oparta na współpracy i wymianie z ludźmi");
 if(scores[4]>=scores[5]) environments.push("problemy wymagające zrozumienia i myślenia");
 if(scores[5]>=scores[4]) environments.push("cele, przy których można zobaczyć konkretny efekt");

 app.innerHTML=`<div class="top"><span>JOB DNA</span><span>40 / 40</span></div>
 <div class="progress"><div class="bar" style="width:100%"></div></div>
 <div class="result">
 <p style="text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700;color:#777">Twój wynik</p>
 <h1>${title}</h1>
 <p>To nie jest etykieta osobowości. To mapa preferencji wynikająca z powtarzających się wyborów.</p>
 <div class="card">
 <h2 style="font-size:25px">Najmocniejsze sygnały</h2>${topTags}
 <p>Najsilniej zaznaczają się trzy obszary. Ich połączenie jest ważniejsze niż pojedynczy wynik.</p>
 </div>
 <div class="card" style="margin-top:16px"><h2 style="font-size:25px">Twój profil</h2>${bars}</div>
 <div class="card" style="margin-top:16px"><h2 style="font-size:25px">Środowisko do sprawdzenia</h2>
 <ul class="list">${environments.slice(0,4).map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="card" style="margin-top:16px"><h2 style="font-size:25px">Co może Cię męczyć</h2>
 <ul class="list">${low.map(x=>`<li>Długotrwała przewaga obszaru „${dims[x.i][0]}” może być mniej naturalna dla Twojego profilu.</li>`).join('')}</ul></div>
