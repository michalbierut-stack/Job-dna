<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JOB DNA — V6</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;margin:10px 0 28px;font-weight:800;letter-spacing:.25em;font-size:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:28px;padding:28px 24px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.kicker{font-size:13px;letter-spacing:.16em;color:#777;font-weight:800;margin-bottom:18px}h1{font-size:31px;line-height:1.12;margin:0 0 16px}h2{font-size:25px;line-height:1.2;margin:0 0 14px}
p{font-size:18px;line-height:1.5;color:#555}.note{background:#efefeb;border-radius:20px;padding:18px;margin:22px 0;color:#555;font-size:16px;line-height:1.5}
button{width:100%;border:0;border-radius:18px;padding:18px 16px;font-size:17px;font-weight:750;background:#171717;color:white}.progress{height:8px;background:#e4e4e1;border-radius:99px;overflow:hidden;margin:20px 0}.bar{height:100%;background:#171717}
.qnum{color:#777;font-size:14px;margin-bottom:18px}.scenario{font-size:20px;line-height:1.45;color:#555;margin-bottom:22px}.option{display:block;width:100%;text-align:left;background:#fff;color:#171717;border:1.5px solid #d6d6d2;border-radius:20px;margin:12px 0;padding:19px;font-size:17px;line-height:1.45;font-weight:500}.option.selected{border:2px solid #171717;background:#f0f0ed}
.nav{display:flex;gap:10px;margin-top:20px}.nav button{flex:1}.back{background:#e8e8e4;color:#171717}.small{font-size:14px;color:#777;line-height:1.5}.result h1{font-size:43px}.pill{display:inline-block;background:#eeeae4;border-radius:999px;padding:10px 15px;margin:5px 4px 5px 0;font-weight:700}.row{margin:20px 0}.rowhead{display:flex;justify-content:space-between;font-weight:700;font-size:17px}.track{height:10px;background:#e4e4e1;border-radius:99px;margin-top:8px;overflow:hidden}.fill{height:100%;background:#171717}hr{border:0;border-top:1px solid #ddd;margin:28px 0}ul{padding-left:22px;font-size:17px;line-height:1.6;color:#444}
@media(max-width:500px){.card{padding:24px 18px}h1{font-size:29px}.scenario{font-size:19px}.option{font-size:16px}}
</style>
</head>
<body><div class="wrap"><div class="top"><span>J O B&nbsp;&nbsp;D N A</span><span>V6</span></div><div id="app"></div></div>
<script>
const Q=[
["Masz do wyboru dwa zadania na najbliższe dni.","Dokończyć dobrze znane zadanie, w którym dokładnie wiesz, czego się od Ciebie oczekuje.","Zacząć nowe zadanie, w którym część rzeczy trzeba dopiero ustalić.","structure","experiment"],
["W pracy pojawia się problem, którego nikt wcześniej nie opisywał.","Najpierw zbierasz informacje i próbujesz dokładnie zrozumieć, co się dzieje.","Najpierw próbujesz kilku rozwiązań i sprawdzasz, co zadziała.","depth","tempo"],
["Dostajesz odpowiedzialność za ważną sprawę.","Wolisz mieć swobodę działania i samodzielnie ustalać sposób pracy.","Wolisz mieć jasno określone zasady, zakres odpowiedzialności i sposób oceny wyniku.","autonomy","stability"],
["Masz osiągnąć cel, ale możesz wybrać sposób.","Najbardziej motywuje Cię konkretny, mierzalny rezultat.","Bardziej liczy się dla Ciebie to, żeby sposób działania był dobrze poukładany.","result","structure"],
["Ważne zadanie zależy od kilku osób.","Naturalnie zaczynasz pilnować, żeby ludzie dobrze się ze sobą porozumieli.","Naturalnie zaczynasz pilnować, żeby kolejne kroki były wykonane na czas.","people","structure"],
["Masz godzinę na decyzję, ale nie masz wszystkich informacji.","Podejmujesz decyzję na podstawie tego, co już wiesz.","Próbujesz jeszcze zdobyć najważniejsze brakujące informacje.","tempo","depth"],
["Projekt jest stabilny i działa dobrze.","Chcesz przede wszystkim utrzymać jego jakość i przewidywalność.","Chcesz sprawdzić, czy można zrobić coś nowego lub lepszego.","stability","experiment"],
["W grupie pojawia się różnica zdań.","Skupiasz rozmowę na tym, co każdy z uczestników naprawdę chce osiągnąć.","Skupiasz rozmowę na faktach, decyzjach i tym, co trzeba zrobić dalej.","people","result"],
["Masz możliwość prowadzenia zadania po swojemu.","To Cię wyraźnie cieszy, nawet jeśli oznacza większą odpowiedzialność.","Wolisz, gdy ktoś ustali główne ramy, a Ty skupisz się na wykonaniu.","autonomy","structure"],
["Przez kilka tygodni pracujesz nad czymś, czego efekt będzie widoczny dopiero na końcu.","Nie przeszkadza Ci to, jeśli widzisz sens i wiesz, do czego zmierzasz.","Potrzebujesz po drodze częściej widzieć konkretne efekty.","depth","result"],
["Nowa osoba dołącza do zespołu.","Chcesz najpierw poznać jej sposób myślenia i doświadczenia.","Chcesz jak najszybciej ustalić, kto za co odpowiada.","people","tempo"],
["Dostajesz zadanie z bardzo ogólnym opisem.","Traktujesz to jako okazję do samodzielnego zbudowania rozwiązania.","W pierwszej kolejności chcesz doprecyzować oczekiwania i zasady.","experiment","structure"],
["Masz dwa równie dobre sposoby wykonania zadania.","Wybierasz ten, który daje większą szansę na lepszy wynik.","Wybierasz ten, który jest bardziej przewidywalny i sprawdzony.","result","stability"],
["W ciągu jednego dnia zmieniają się priorytety.","Łatwo przestawiasz się na nowe zadanie.","Wolisz dokończyć rozpoczętą rzecz, zanim przejdziesz dalej.","tempo","structure"],
["Ktoś prosi Cię o pomoc w trudnej sprawie.","Najpierw próbujesz zrozumieć jego sytuację i punkt widzenia.","Najpierw próbujesz znaleźć rozwiązanie problemu.","people","result"],
["Masz nauczyć się nowej rzeczy.","Chcesz zrozumieć, jak i dlaczego to działa.","Chcesz jak najszybciej nauczyć się tego, co potrzebne do działania.","depth","tempo"],
["Firma proponuje Ci dwie role.","Jedna daje większą swobodę, ale mniej pewności co do tego, jak będzie wyglądała praca.","Druga jest bardziej przewidywalna, ale ma wyraźnie określone zasady.","autonomy","stability"],
["Pracujesz nad czymś, co można jeszcze poprawić.","Masz ochotę dalej eksperymentować, nawet jeśli obecne rozwiązanie już działa.","Wolisz zakończyć pracę, kiedy osiągniesz uzgodniony poziom jakości.","experiment","result"],
["Masz do wyboru spotkanie z ludźmi albo spokojną pracę samemu.","Wybierasz spotkanie, jeśli może pomóc w rozwiązaniu sprawy.","Wybierasz spokojną pracę, jeśli możesz wtedy zrobić konkretny postęp.","people","depth"],
["Ważna decyzja będzie miała skutki przez długi czas.","Wolisz poświęcić więcej czasu na analizę przed decyzją.","Wolisz podjąć decyzję i w razie potrzeby później ją skorygować.","depth","tempo"],
["Otrzymujesz cel bez dokładnej instrukcji.","Sam ustalasz plan i sposób dojścia do celu.","Najpierw chcesz ustalić z przełożonym, jak powinien wyglądać sposób działania.","autonomy","structure"],
["Masz trudne zadanie i ograniczony czas.","Skupiasz się na tym, co da największy efekt.","Skupiasz się na tym, żeby nic ważnego nie zostało pominięte.","result","depth"],
["Zespół ma dobre wyniki, ale atmosfera jest napięta.","Uważasz, że trzeba najpierw poprawić współpracę między ludźmi.","Uważasz, że najpierw trzeba ustalić konkretne problemy i działania naprawcze.","people","result"],
["Twoje zadanie nagle staje się dwa razy większe.","Szukasz sposobu, żeby szybko zmienić plan i działać dalej.","Najpierw chcesz ustalić nowe priorytety i uporządkować zakres.","tempo","structure"],
["Masz pomysł, którego nikt wcześniej nie próbował.","Chcesz go przetestować, nawet jeśli nie wiadomo, czy się sprawdzi.","Najpierw szukasz dowodów, że warto w niego wejść.","experiment","depth"],
["Wybierasz pracę na kolejny rok.","Wolisz większą przewidywalność i spokojne warunki.","Wolisz większą możliwość zmiany kierunku, nawet kosztem pewności.","stability","experiment"],
["Masz osiągnąć wynik wspólnie z inną osobą.","Chcesz jasno podzielić odpowiedzialność i pilnować swojego obszaru.","Wolisz blisko współpracować i wspólnie dochodzić do rozwiązania.","structure","people"],
["Dostajesz zadanie, które potrafisz wykonać bardzo dobrze.","Wolisz zrobić je samodzielnie bez zbędnych konsultacji.","Chętnie konsultujesz je z innymi, jeśli może to poprawić końcowy efekt.","autonomy","people"],
["Po zakończeniu projektu oceniasz swoją pracę.","Najpierw patrzysz, czy osiągnięto zamierzony rezultat.","Najpierw patrzysz, co można było zrobić lepiej i czego się nauczyłeś.","result","depth"],
["Masz dużo różnych tematów w pracy.","Taki układ daje Ci energię, bo każdy dzień może wyglądać inaczej.","Wolisz ograniczyć liczbę tematów i wejść w nie głębiej.","experiment","depth"],
["Masz podjąć decyzję, ale część osób się z nią nie zgadza.","Najpierw chcesz zrozumieć ich argumenty.","Jeśli masz wystarczające dane, podejmujesz decyzję mimo różnicy zdań.","people","autonomy"],
["Pojawia się pilna sprawa, która burzy plan dnia.","Traktujesz to jako normalną część pracy i szybko zmieniasz kolejność zadań.","Najpierw oceniasz, czy rzeczywiście trzeba zmieniać wcześniej ustalony plan.","tempo","stability"],
["Masz stworzyć rozwiązanie, które będzie używane przez długi czas.","Wolisz sprawdzone rozwiązanie, nawet jeśli nie jest idealne.","Wolisz poszukać lepszego rozwiązania, nawet jeśli wymaga testów.","stability","experiment"],
["Kiedy uczysz kogoś czegoś trudnego, bardziej naturalne jest dla Ciebie:","Pokazać mu krok po kroku, jak to zrobić.","Wyjaśnić mu, dlaczego to działa i pozwolić samemu dojść do rozwiązania.","structure","depth"],
["Ważny projekt jest już prawie gotowy.","Chcesz jak najszybciej zamknąć temat i zobaczyć efekt.","Wolisz jeszcze raz spokojnie sprawdzić całość przed zakończeniem.","result","stability"],
["Masz wybrać między dwiema ofertami.","Jedna daje większą swobodę i możliwość wpływania na sposób działania.","Druga daje jasne zasady, przewidywalne obowiązki i stabilne warunki.","autonomy","stability"],
["Współpracujesz z osobą o zupełnie innym stylu pracy.","Próbujesz znaleźć sposób współpracy, który będzie wygodny dla obu stron.","Wolisz ustalić konkretne zasady, dzięki którym różnice nie będą przeszkadzać.","people","structure"]
];
const L={result:"Rezultat",autonomy:"Autonomia",stability:"Stabilność",structure:"Struktura",tempo:"Tempo",depth:"Głębia",people:"Ludzie",experiment:"Eksperyment"};
let i=0,A=Array(Q.length).fill(null);
function intro(){app.innerHTML=`<div class="card"><div class="kicker">WERSJA V6 · OSTATNIA RUNDA TESTOWA</div><h1>Odpowiadaj tak, jak zachowujesz się naprawdę.</h1><p>W każdym pytaniu wybierz jedną z dwóch sytuacji — tę, która jest Ci bliższa. Nie szukaj „lepszej” odpowiedzi.</p><div class="note"><b>Ważne:</b> obie odpowiedzi są neutralne. Test nie sprawdza wiedzy ani tego, jak powinien zachowywać się dobry pracownik.</div><p class="small">36 pytań · około 7–10 minut · podobne wybory wracają w różnych sytuacjach, żeby sprawdzić, czy wzorzec się powtarza.</p><button onclick="render()">Zaczynam</button></div>`}
function render(){let q=Q[i],a=A[i];app.innerHTML=`<div class="card"><div class="qnum">PYTANIE ${i+1} Z ${Q.length}</div><div class="progress"><div class="bar" style="width:${i/Q.length*100}%"></div></div><div class="scenario">${q[0]}</div><button class="option ${a===0?'selected':''}" onclick="pick(0)">${q[1]}</button><button class="option ${a===1?'selected':''}" onclick="pick(1)">${q[2]}</button><div class="nav"><button class="back" onclick="prev()" ${i===0?'disabled':''}>Wstecz</button><button id="next" onclick="next()" ${a===null?'disabled':''}>${i===Q.length-1?'Zobacz wynik':'Dalej'}</button></div></div>`}
function pick(n){A[i]=n;render()} function prev(){if(i){i--;render()}} function next(){if(A[i]===null)return;if(i<Q.length-1){i++;render()}else result()}
function result(){let s={result:0,autonomy:0,stability:0,structure:0,tempo:0,depth:0,people:0,experiment:0};Q.forEach((q,j)=>s[q[3+A[j]]]++);let max=Q.length/2,arr=Object.entries(s).map(x=>[x[0],Math.round(x[1]/max*100)]).sort((a,b)=>b[1]-a[1]),top=arr.slice(0,3).map(x=>L[x[0]]);let title="Profil mieszany",desc="Kilka sposobów działania jest u Ciebie mocno zaznaczonych. Najważniejsze będzie sprawdzenie, w jakich warunkach ten układ działa najlepiej.";if(top.includes("Ludzie")&&top.includes("Rezultat")){title="Łącznik";desc="Najmocniej działa na Ciebie połączenie współpracy z ludźmi i doprowadzania spraw do konkretnego efektu."}else if(top.includes("Głębia")&&top.includes("Struktura")){title="Analityk";desc="Najmocniej działa na Ciebie rozumienie problemu, porządkowanie go i budowanie rozwiązania krok po kroku."}else if(top.includes("Rezultat")&&top.includes("Autonomia")){title="Sprawca";desc="Najmocniej działa na Ciebie swoboda działania połączona z odpowiedzialnością za konkretny wynik."}else if(top.includes("Stabilność")&&top.includes("Struktura")){title="Stabilizator";desc="Najmocniej działa na Ciebie przewidywalne środowisko, porządek i odpowiedzialność za dobrze określony obszar."}else if(top.includes("Eksperyment")&&top.includes("Tempo")){title="Inicjator";desc="Najmocniej działa na Ciebie możliwość próbowania nowych rozwiązań i szybkie przechodzenie od pomysłu do działania."}let rows=arr.map(x=>`<div class="row"><div class="rowhead"><span>${L[x[0]]}</span><span>${x[1]}%</span></div><div class="track"><div class="fill" style="width:${x[1]}%"></div></div></div>`).join("");app.innerHTML=`<div class="card result"><div class="kicker">TWÓJ WZORZEC</div><h1>${title}</h1><p>${desc}</p>${top.map(x=>`<span class="pill">${x}</span>`).join("")}<hr><h2>Mapa profilu</h2>${rows}<hr><h2>Co warto sprawdzić dalej</h2><ul><li>Czy ten układ powtarza się przy ponownym rozwiązaniu testu.</li><li>W jakich zadaniach daje Ci energię, a w jakich zaczyna męczyć.</li><li>Jak przekłada się na konkretne rodzaje pracy, a nie tylko nazwy stanowisk.</li></ul><div class="note"><b>Prototyp:</b> wynik jest hipotezą o preferowanym sposobie działania, nie diagnozą psychologiczną ani narzędziem rekrutacyjnym.</div><button onclick="location.reload()">Zrób test ponownie</button></div>`}
intro();
</script></body></html>
